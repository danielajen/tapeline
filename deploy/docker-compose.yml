# The whole system, locally.
#
#   docker compose -f deploy/docker-compose.yml up -d
#
# Everything here is sized for a laptop and is not a model of the production
# deployment — that lives in deploy/terraform and deploy/k8s. What it does
# model faithfully is the topology: the same topics, the same schema registry
# subjects, the same wire format. A change that works here works there.

name: tapeline

services:
  # KRaft mode: no ZooKeeper. Fewer moving parts and the direction Kafka has
  # taken, so the local stack matches what MSK runs.
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Exactly-once needs the transaction coordinator, and a single broker
      # must be told it is allowed to host it with one replica.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: tapeline-local-cluster-01
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:29092"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Topics are created explicitly rather than auto-created, because
  # auto-creation uses the broker default partition count and silently caps
  # the parallelism of every consumer downstream.
  kafka-init:
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      set -e
      create() {
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic $$1 --partitions $$2 --replication-factor 1 \
          --config min.insync.replicas=1 --config retention.ms=$$3
      }
      # Book traffic is the heaviest, so it gets the most partitions.
      create md.book.v1       12 86400000
      create md.trades.v1      6 604800000
      create md.chain.v1       3 604800000
      create md.quotes.v1      6 86400000
      create md.bars.v1        6 604800000
      create md.divergence.v1  3 604800000
      kafka-topics --bootstrap-server kafka:29092 --list
      "

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      # FULL, not the BACKWARD default. During a rolling deploy both schema
      # versions are live at once, so only FULL is actually safe.
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: full
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    # No persistence: everything in Redis here is a cache or a short-lived
    # nonce. Losing it costs a cold start, not data.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: tapeline
      POSTGRES_USER: tapeline
      POSTGRES_PASSWORD: tapeline
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tapeline"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ClickHouse stands in for the real-time OLAP tier. Pinot is the closer
  # match to Uber's stack and the production choice; ClickHouse is one
  # container instead of five, which is what a laptop and a CI runner want.
  # The serving tier reaches both over JDBC, so the swap is a URL.
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    ports:
      - "8123:8123"
    environment:
      CLICKHOUSE_DB: tapeline
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./clickhouse:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }

  # MinIO is the S3 the Iceberg tables live in locally.
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: tapeline
      MINIO_ROOT_PASSWORD: tapeline123
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2024-11-05T11-29-45Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 tapeline tapeline123 &&
      mc mb --ignore-existing local/tapeline-lakehouse
      "

  jobmanager:
    image: flink:1.20.1-scala_2.12-java17
    ports:
      - "8082:8081"
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        state.backend.type: rocksdb
        state.checkpoints.dir: file:///flink-checkpoints
        state.savepoints.dir: file:///flink-savepoints
        execution.checkpointing.interval: 30s
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    volumes:
      - flink-checkpoints:/flink-checkpoints
      - flink-savepoints:/flink-savepoints
      - ../stream/target:/opt/tapeline:ro

  taskmanager:
    image: flink:1.20.1-scala_2.12-java17
    depends_on:
      - jobmanager
    command: taskmanager
    scale: 2
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
        state.backend.type: rocksdb
        state.checkpoints.dir: file:///flink-checkpoints
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    volumes:
      - flink-checkpoints:/flink-checkpoints
      - flink-savepoints:/flink-savepoints
      - ../stream/target:/opt/tapeline:ro

  ingestd:
    build:
      context: ../ingest
      dockerfile: Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "9101:9101"
    environment:
      TAPELINE_KAFKA_BROKERS: kafka:29092
      TAPELINE_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      TAPELINE_SYMBOLS: BTC-USD,ETH-USD,SOL-USD
      TAPELINE_VENUES: coinbase,kraken,binance
      TAPELINE_METRICS_ADDR: ":9101"
      TAPELINE_LOG_LEVEL: info
      TAPELINE_OTLP_ENDPOINT: "otel-collector:4317"
      TAPELINE_TRACE_SAMPLE_RATIO: "0.05"

  serving:
    build:
      # Repository root, because the serving module compiles its gRPC stubs
      # from proto/ which sits outside its own directory.
      context: ..
      dockerfile: serving/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      TAPELINE_KAFKA_BROKERS: kafka:29092
      TAPELINE_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      TAPELINE_REDIS_HOST: redis
      TAPELINE_POSTGRES_URL: jdbc:postgresql://postgres:5432/tapeline
      TAPELINE_OLAP_URL: jdbc:clickhouse://clickhouse:8123/tapeline
      # Reflection on locally so grpcurl works without a proto file.
      TAPELINE_GRPC_REFLECTION: "true"

  # Receives spans over OTLP from the ingestion tier and, once the Java side
  # is instrumented, from the serving tier — so one trace spans the Kafka hop
  # between them. Exports to stdout by default; point it at Tempo or Jaeger by
  # adding an exporter to otel-collector.yaml.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    deploy:
      resources:
        limits: { memory: 200M }

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d

  grafana:
    image: grafana/grafana:11.3.1
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: tapeline
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  flink-checkpoints:
  flink-savepoints:
