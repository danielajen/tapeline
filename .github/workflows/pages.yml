# Publishes the measured results as a public page.
#
# The Grafana and Prometheus dashboards only exist while the stack is running
# on a laptop, which makes them useless as something to link to. This is the
# durable version: a static page served by GitHub Pages, linking to the CI runs
# that produce every figure on it, so a reader can check any number rather than
# take it on trust.

name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued deploy replaces a running one rather than racing it; the newest
# content is always what should be live.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
