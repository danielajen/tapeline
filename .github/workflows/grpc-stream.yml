# gRPC server-streaming under concurrent subscribers.
#
# This exists because the streaming path was the one tier with no evidence
# behind it. The load test had been run once and reported zero quotes
# received, which was recorded as "undiagnosed" rather than as a result. The
# cause was mundane: nothing was producing quotes at the time, so the server
# had nothing to fan out. A test that cannot distinguish "the server is broken"
# from "the input was empty" is not a test.
#
# The fix is to seed the quote topic for the duration of the run, so a zero
# here means the serving tier, and nothing else.
#
# CI runs a smaller version of the same scenario, not a different one: the
# stage shape lives in the k6 script and is parameterised, so the numbers
# below and the numbers from a full run come from the same code.

name: gRPC streaming

on:
  push:
    branches: [main]
    paths:
      - 'serving/**'
      - 'proto/**'
      - 'loadtest/**'
      - '.github/workflows/grpc-stream.yml'
  pull_request:
    paths:
      - 'serving/**'
      - 'proto/**'
  workflow_dispatch:

jobs:
  stream:
    name: Streaming API sustains subscribers and delivers quotes
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      TAPELINE_KAFKA_BROKERS: localhost:9092
      TAPELINE_SCHEMA_REGISTRY_URL: http://localhost:8081
      TAPELINE_GRPC_PORT: "9090"
      TAPELINE_GRPC_REFLECTION: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: tools/quotegen/go.sum

      - name: Start Kafka, Schema Registry, Redis, Postgres and ClickHouse
        run: |
          docker compose -f deploy/docker-compose.yml up -d \
            kafka schema-registry redis postgres clickhouse
          for i in $(seq 1 60); do
            docker exec tapeline-kafka-1 kafka-broker-api-versions \
              --bootstrap-server kafka:29092 >/dev/null 2>&1 && break
            sleep 5
          done
          curl -fsS --retry 30 --retry-delay 5 --retry-all-errors \
            http://localhost:8081/subjects >/dev/null
          # Redis backs the rate limiter and the nonce replay guard. Without it
          # every signed request fails closed and the test measures nothing.
          for i in $(seq 1 30); do
            docker exec tapeline-redis-1 redis-cli ping 2>/dev/null | grep -q PONG && break
            sleep 2
          done
          # Both stores initialise from mounted DDL. Waiting for the schema
          # rather than the port matters: the container answers TCP well
          # before docker-entrypoint-initdb.d has run.
          for i in $(seq 1 30); do
            docker exec tapeline-postgres-1 psql -U tapeline -d tapeline \
              -c 'SELECT 1' >/dev/null 2>&1 && break
            sleep 2
          done
          for i in $(seq 1 30); do
            curl -fsS 'http://localhost:8123/?query=SELECT%201' >/dev/null 2>&1 && break
            sleep 2
          done
          echo "clickhouse tables:"
          curl -s 'http://localhost:8123/?query=SHOW%20TABLES%20FROM%20tapeline' || true
          echo "infrastructure up"

      - name: Create topics
        run: |
          for spec in md.quotes.v1:4 md.trades.v1:4 md.bars.v1:4; do
            docker exec tapeline-kafka-1 kafka-topics --bootstrap-server kafka:29092 \
              --create --if-not-exists --topic "${spec%%:*}" \
              --partitions "${spec##*:}" --replication-factor 1
          done

      - name: Register the quote schema
        id: schema
        run: |
          SCHEMA=$(python3 -c "import json;print(json.dumps(open('stream/src/main/resources/avro/quote.v1.avsc').read()))")
          ID=$(curl -s -X POST -H "Content-Type: application/vnd.schemaregistry.v1+json" \
            --data "{\"schema\": $SCHEMA}" \
            http://localhost:8081/subjects/md.quotes.v1-value/versions \
            | python3 -c "import json,sys;print(json.load(sys.stdin)['id'])")
          echo "quote schema id: $ID"
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Build the serving jar
        run: cd serving && mvn -B -q package -DskipTests

      # Seed before the server starts so the snapshot-on-subscribe path has
      # something to return, and keep seeding through the run so subscribers
      # receive pushed updates rather than only the opening snapshot.
      - name: Prime the quote topic
        run: |
          cd tools/quotegen && go build -o /tmp/gen . && cd ../..
          /tmp/gen -kind quote -schema-id "${{ steps.schema.outputs.id }}" \
            -rate 200 -duration 15s -topic md.quotes.v1 \
            -schema stream/src/main/resources/avro/quote.v1.avsc
          PRIMED=$(docker exec tapeline-kafka-1 kafka-get-offsets \
            --bootstrap-server kafka:29092 --topic md.quotes.v1 | awk -F: '{s+=$3} END{print s+0}')
          echo "primed=$PRIMED"
          [ "$PRIMED" -gt 100 ] || { echo "::error::only $PRIMED quotes primed"; exit 1; }

      - name: Start the serving tier
        run: |
          nohup java -jar serving/target/*.jar > /tmp/serving.log 2>&1 &
          echo $! > /tmp/serving.pid
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/actuator/health >/dev/null 2>&1 && break
            sleep 5
          done
          curl -fsS http://localhost:8080/actuator/health || {
            echo "::error::serving tier did not become healthy"
            tail -100 /tmp/serving.log
            exit 1
          }
          echo "serving tier healthy"

      - name: Install k6
        run: |
          curl -fsSL https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz \
            -o /tmp/k6.tgz
          tar -xzf /tmp/k6.tgz -C /tmp
          sudo mv /tmp/k6-v0.54.0-linux-amd64/k6 /usr/local/bin/k6
          k6 version

      - name: Run the streaming load test
        run: |
          mkdir -p loadtest/results
          # Keep producing for the whole run. Subscribers that only ever see
          # the opening snapshot would pass a "received a quote" check while
          # the fan-out path was entirely broken.
          /tmp/gen -kind quote -schema-id "${{ steps.schema.outputs.id }}" \
            -rate 200 -duration 200s -topic md.quotes.v1 \
            -schema stream/src/main/resources/avro/quote.v1.avsc &
          GEN=$!

          k6 run \
            -e GRPC_ADDR=localhost:9090 \
            -e PEAK_VUS=60 -e HOLD=60s -e HOLD_SECONDS=60 \
            loadtest/k6/grpc-stream.js || echo "k6 exited non-zero (thresholds)"

          wait $GEN || true

      # Measured outside k6 deliberately. k6 reported a first-quote p95 that
      # reproduced the hold duration to four significant figures across two
      # runs and did not move when the hold was sliced, so it was timing
      # itself. Rather than keep guessing at its event loop, this opens real
      # streams with grpcurl and times the first message off the socket.
      - name: Measure time to first quote
        run: |
          curl -fsSL https://github.com/fullstorydev/grpcurl/releases/download/v1.9.1/grpcurl_1.9.1_linux_x86_64.tar.gz \
            -o /tmp/grpcurl.tgz
          tar -xzf /tmp/grpcurl.tgz -C /tmp
          sudo mv /tmp/grpcurl /usr/local/bin/grpcurl
          grpcurl -version

          # Keep quotes flowing so a sample cannot succeed only on a stale
          # snapshot left over from an earlier step.
          /tmp/gen -kind quote -schema-id "${{ steps.schema.outputs.id }}" \
            -rate 200 -duration 90s -topic md.quotes.v1 \
            -schema stream/src/main/resources/avro/quote.v1.avsc &
          GEN=$!
          sleep 5
          python3 scripts/first_quote_probe.py --addr localhost:9090 --samples 25
          wait $GEN || true

      - name: Assert quotes actually reached subscribers
        run: |
          F=loadtest/results/grpc-stream-summary.txt
          [ -f "$F" ] || { echo "::error::k6 produced no summary"; exit 1; }
          cat "$F"
          RECEIVED=$(grep '^quotes_received=' "$F" | cut -d= -f2)
          # The whole point of this workflow. Zero means the fan-out from the
          # Kafka consumer to the open streams did not happen.
          if [ "${RECEIVED:-0}" -lt 1 ]; then
            echo "::error::subscribers received no quotes"
            echo "--- serving log ---"; tail -120 /tmp/serving.log
            exit 1
          fi
          echo "OK: subscribers received $RECEIVED quotes"

      - name: Serving log on failure
        if: failure()
        run: tail -200 /tmp/serving.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grpc-stream-results
          path: |
            loadtest/results/
            first-quote-results.txt
            /tmp/serving.log
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: |
          kill "$(cat /tmp/serving.pid)" 2>/dev/null || true
          docker compose -f deploy/docker-compose.yml down -v || true
