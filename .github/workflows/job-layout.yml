# Monolithic job vs one job per topic.
#
# DESIGN_DECISIONS d2 tells a story: one Flink job consuming every topic hit a
# checkpoint tuning wall, because book state and trade windows have different
# profiles but shared a checkpoint interval, a parallelism and a restart.
# MEASUREMENTS then asked for the before-and-after and recorded "neither has
# been run". Until now the story was an assertion.
#
# MonolithicJob was kept runnable precisely so this could be measured rather
# than argued. This workflow runs both layouts against identical seeded input
# on the same cluster and reports checkpoint behaviour for each.
#
# What this can and cannot show, stated up front: a 4-vCPU runner with a
# 90-second window measures checkpoint duration, state size and failure count
# honestly. It cannot measure max sustainable throughput or steady-state CPU,
# which need sustained load on dedicated hardware. Those stay marked unmeasured
# rather than being filled in with numbers this run cannot support.

name: Job layout

on:
  push:
    branches: [main]
    paths:
      - 'stream/**'
      - 'scripts/install-flink.sh'
      - '.github/workflows/job-layout.yml'
  workflow_dispatch:

jobs:
  compare:
    name: Monolith vs per-topic checkpoint behaviour
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      FLINK_VERSION: "1.20.1"
      FLINK_SLOTS: "8"
      TAPELINE_KAFKA_BROKERS: localhost:9092
      TAPELINE_SCHEMA_REGISTRY_URL: http://localhost:8081

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: tools/quotegen/go.sum

      - name: Start Kafka and Schema Registry
        run: |
          docker compose -f deploy/docker-compose.yml up -d kafka schema-registry
          for i in $(seq 1 60); do
            docker exec tapeline-kafka-1 kafka-broker-api-versions \
              --bootstrap-server kafka:29092 >/dev/null 2>&1 && break
            sleep 5
          done
          curl -fsS --retry 30 --retry-delay 5 --retry-all-errors \
            http://localhost:8081/subjects >/dev/null

      - name: Create topics
        run: |
          for spec in md.book.v1:6 md.trades.v1:6 md.quotes.v1:4 md.bars.v1:4 md.divergence.v1:4; do
            docker exec tapeline-kafka-1 kafka-topics --bootstrap-server kafka:29092 \
              --create --if-not-exists --topic "${spec%%:*}" \
              --partitions "${spec##*:}" --replication-factor 1
          done

      # Both layouts read the same seeded data. Books outnumber trades roughly
      # ten to one, which is the ratio that makes the two stages' state
      # profiles diverge in the first place - the entire subject of the
      # measurement.
      - name: Seed books and trades
        run: |
          cd tools/quotegen && go build -o /tmp/gen . && cd ../..
          reg() {
            S=$(python3 -c "import json;print(json.dumps(open('$2').read()))")
            curl -s -X POST -H "Content-Type: application/vnd.schemaregistry.v1+json" \
              --data "{\"schema\": $S}" \
              "http://localhost:8081/subjects/$1-value/versions" \
              | python3 -c "import json,sys;print(json.load(sys.stdin)['id'])"
          }
          BOOK_ID=$(reg md.book.v1 ingest/schemas/avro/book_delta.v1.avsc)
          TRADE_ID=$(reg md.trades.v1 ingest/schemas/avro/trade.v1.avsc)
          echo "book schema=$BOOK_ID trade schema=$TRADE_ID"

          /tmp/gen -kind book  -schema-id "$BOOK_ID"  -rate 500 -duration 30s \
            -topic md.book.v1   -schema ingest/schemas/avro/book_delta.v1.avsc &
          /tmp/gen -kind trade -schema-id "$TRADE_ID" -rate 50  -duration 30s \
            -topic md.trades.v1 -schema ingest/schemas/avro/trade.v1.avsc &
          wait

          for t in md.book.v1 md.trades.v1; do
            N=$(docker exec tapeline-kafka-1 kafka-get-offsets \
              --bootstrap-server kafka:29092 --topic "$t" | awk -F: '{s+=$3} END{print s+0}')
            echo "seeded $t = $N"
            [ "$N" -gt 500 ] || { echo "::error::only $N records on $t"; exit 1; }
          done

      - name: Build the stream jar
        run: cd stream && mvn -B -q package -DskipTests

      - name: Install and start Flink
        run: scripts/install-flink.sh

      - name: Measure each layout
        run: |
          F=/tmp/flink-${FLINK_VERSION}
          # The client JVM needs its own --add-opens; the cluster gets them
          # from config.yaml. Losing this is DEFECT 5 in a different place.
          export FLINK_ENV_JAVA_OPTS="--add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.util.concurrent=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/java.text=ALL-UNNAMED --add-opens=java.base/java.time=ALL-UNNAMED"

          submit() {
            "$F/bin/flink" run -d \
              -c io.tapeline.stream.TapelineJob \
              stream/target/tapeline-stream-0.1.0.jar "$1" 2>&1 \
              | grep -oE '[0-9a-f]{32}' | head -1
          }
          cancel() { "$F/bin/flink" cancel "$1" >/dev/null 2>&1 || true; }

          # Each layout gets the same wall-clock observation window, long
          # enough for several checkpoints at the configured 10s interval.
          WINDOW=90

          echo "=== monolith ==="
          MONO=$(submit monolith)
          echo "job $MONO"; sleep $WINDOW
          python3 scripts/checkpoint_stats.py "$MONO" monolith > /tmp/monolith.txt || true
          cat /tmp/monolith.txt
          cancel "$MONO"
          sleep 15

          echo "=== per-topic ==="
          BOOK=$(submit book)
          TRADES=$(submit trades)
          echo "book job $BOOK, trades job $TRADES"; sleep $WINDOW
          python3 scripts/checkpoint_stats.py "$BOOK" book-job > /tmp/book.txt || true
          python3 scripts/checkpoint_stats.py "$TRADES" trades-job > /tmp/trades.txt || true
          cat /tmp/book.txt /tmp/trades.txt
          cancel "$BOOK"; cancel "$TRADES"

          python3 scripts/layout_report.py /tmp/monolith.txt /tmp/book.txt /tmp/trades.txt \
            | tee job-layout-results.txt

      - name: Flink logs on failure
        if: failure()
        run: tail -120 /tmp/flink-${FLINK_VERSION}/log/*taskexecutor*.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: job-layout-results
          path: job-layout-results.txt
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: |
          /tmp/flink-${FLINK_VERSION}/bin/stop-cluster.sh || true
          docker compose -f deploy/docker-compose.yml down -v || true
